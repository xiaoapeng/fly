name: nightly

# Exercise the generated Cortex-M projects and firmware packages in Release mode.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  arm-release:
    name: arm-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cross toolchain and build tools
        run: |
          # Azure runners can use the Azure Ubuntu package mirror.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://[^ /]*ec2.archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            gdb-multiarch ninja-build cmake git
      - name: Bootstrap Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install kconfiglib requests
      - name: Build generated ARM projects and package FRDM templates
        run: .venv/bin/python tool/test/check_standalone_projects.py --matrix arm --build-type Release
