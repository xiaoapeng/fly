name: ci

# PR gate. See docs/CI.md for the job list, required checks and the
# branch-protection setup that makes these checks blocking.
on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kconfig:
    name: kconfig
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kconfiglib
        run: python3 -m pip install kconfiglib requests
      - name: Validate generated configurations
        run: python3 tool/test/check_standalone_projects.py --matrix config

  arm-build:
    name: arm-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cross toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            gdb-multiarch ninja-build cmake git
      - name: Bootstrap Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install kconfiglib requests
      - name: Validate action and firmware protocols
        run: .venv/bin/python -m unittest discover -s tool/test -p "test_*.py"
      - name: Build generated ARM projects and package FRDM templates
        run: .venv/bin/python tool/test/check_standalone_projects.py --matrix arm

  rv32-build:
    name: rv32-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake git ninja-build
      - name: Install WCH GCC 15.2.0
        # Linux x86_64 asset from openwch/board_manager_files@1ca9500eef50846b88af4a638a9bbc308b5d4b0d.
        env:
          WCH_GCC_URL: https://github.com/medtty/board_manager_files/releases/download/riscv-wch-gcc-15.2.0/riscv-wch-gcc-15.2.0-linux-x86_64.tar.gz
          WCH_GCC_SHA256: d58478f91c134edfb76d73cd82e9a7fff4c74dd9369c591e92567757f4a153cf
        run: |
          archive="$RUNNER_TEMP/riscv-wch-gcc.tar.gz"
          curl --fail --location --retry 3 --silent --show-error --output "$archive" "$WCH_GCC_URL"
          printf '%s  %s\n' "$WCH_GCC_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          toolchain_bin="$RUNNER_TEMP/riscv-wch-gcc/bin"
          compiler="$toolchain_bin/riscv32-wch-elf-gcc"
          "$compiler" --version
          test "$("$compiler" -dumpfullversion)" = 15.2.0
          test "$("$compiler" -dumpmachine)" = riscv32-wch-elf
          printf '%s\n' "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Bootstrap Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install kconfiglib requests
      - name: Build and package CH582 firmware
        run: .venv/bin/python tool/test/check_ch582.py

  host-linux:
    name: host-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build cmake git python3-venv
      - name: Bootstrap Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install kconfiglib requests
      - name: Build generated Linux project
        run: .venv/bin/python tool/test/check_standalone_projects.py --matrix host

  host-macos:
    name: host-macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          python3 -m venv .venv
          .venv/bin/python -m pip install kconfiglib requests
      - name: Build generated macOS project
        run: .venv/bin/python tool/test/check_standalone_projects.py --matrix host

  host-windows:
    name: host-windows
    # MinGW-w64 GCC from the MSYS2 installation that ships with the runner
    # image (C:\msys64). The x64/windows toolchain file looks up `gcc` by name.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MinGW-w64 toolchain
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja"
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'
      - name: Bootstrap Python venv
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install kconfiglib requests
      - name: Build generated Windows project
        run: .\.venv\Scripts\python.exe tool/test/check_standalone_projects.py --matrix host
      - name: Verify Windows generator and application launchers
        run: .\.venv\Scripts\python.exe tool/test/check_standalone_projects.py --sdk-setup-only
      - name: Verify Windows package directory junctions
        run: .\.venv\Scripts\python.exe tool/test/check_standalone_projects.py --image-links-only
